name: Publish Allure Reports

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: allure-pages-publisher
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select oldest unpublished test run
        id: select-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p site
          if git fetch origin gh-pages:gh-pages; then
            git archive gh-pages | tar -x -C site
          fi

          runs_json="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/workflows/jio-tv-tests.yml/runs?branch=main&status=completed&per_page=100")"
          selected=""

          while IFS=$'\t' read -r run_id run_number; do
            artifacts_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact="$(jq -r '.artifacts[] | select(.name | startswith("jio-tv-allure-results-")) | [.id, .name] | @tsv' <<< "$artifacts_json" | head -n 1)"
            [ -n "$artifact" ] || continue

            artifact_name="${artifact#*$'\t'}"
            environment_and_run="${artifact_name#jio-tv-allure-results-}"
            environment="${environment_and_run%-${run_number}}"
            report_path="site/reports/${environment}/${run_number}"
            [ -d "$report_path" ] && continue

            artifact_id="${artifact%%$'\t'*}"
            selected="${run_id}"$'\t'"${run_number}"$'\t'"${environment}"$'\t'"${artifact_id}"
            break
          done < <(jq -r '.workflow_runs | sort_by(.run_number)[] | select(.conclusion != "cancelled") | [.id, .run_number] | @tsv' <<< "$runs_json")

          if [ -z "$selected" ]; then
            echo 'No unpublished Allure runs found.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=$'\t' read -r run_id run_number environment artifact_id <<< "$selected"
          {
            echo 'found=true'
            echo "run_id=$run_id"
            echo "run_number=$run_number"
            echo "environment=$environment"
            echo "artifact_id=$artifact_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download selected Allure results
        if: steps.select-run.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.select-run.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > allure-results.zip
          mkdir -p allure-results
          unzip -q allure-results.zip -d allure-results

      - name: Generate Allure report
        if: steps.select-run.outputs.found == 'true'
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Build report archive site
        if: steps.select-run.outputs.found == 'true'
        shell: bash
        env:
          REPORT_ENVIRONMENT: ${{ steps.select-run.outputs.environment }}
          REPORT_RUN_NUMBER: ${{ steps.select-run.outputs.run_number }}
        run: |
          set -euo pipefail

          report_path="site/reports/$REPORT_ENVIRONMENT/$REPORT_RUN_NUMBER"
          latest_path="site/latest/$REPORT_ENVIRONMENT"
          mkdir -p "$report_path" "$latest_path"
          cp -R allure-report/. "$report_path/"
          rm -rf "$latest_path"
          mkdir -p "$latest_path"
          cp -R allure-report/. "$latest_path/"

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8"><title>JioTV Allure Reports</title></head><body>'
            echo '<h1>JioTV Allure Reports</h1><p>Latest reports by environment:</p><ul>'
            for environment_path in site/latest/*; do
              [ -d "$environment_path" ] || continue
              environment="${environment_path##*/}"
              printf '<li><a href="latest/%s/">%s latest</a></li>\n' "$environment" "$environment"
            done
            echo '</ul><h2>Archived runs</h2><ul>'
            for report_path in site/reports/*/*; do
              [ -d "$report_path" ] || continue
              environment="$(basename "$(dirname "$report_path")")"
              run_number="$(basename "$report_path")"
              printf '<li><a href="reports/%s/%s/">%s run %s</a></li>\n' "$environment" "$run_number" "$environment" "$run_number"
            done
            echo '</ul></body></html>'
          } > site/index.html

      - name: Archive HTML report
        if: steps.select-run.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.select-run.outputs.environment }}-${{ steps.select-run.outputs.run_number }}
          path: allure-report
          retention-days: 90

      - name: Publish report archive to GitHub Pages
        if: steps.select-run.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site