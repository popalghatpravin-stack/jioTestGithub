name: JioTV Tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      browser:
        description: Playwright browser to install
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      test_filter:
        description: Optional NUnit test filter
        required: false
        default: ''
        type: string
      environment:
        description: Test environment label used for report archives
        required: true
        default: dev
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      report_environment: ${{ steps.report-environment.outputs.value }}
    env:
      DOTNET_VERSION: 8.x
      BUILD_CONFIGURATION: Release
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
      REPORT_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Set report environment
        id: report-environment
        shell: bash
        run: echo "value=$REPORT_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore project
        run: dotnet restore JioTv.Playwright.csproj

      - name: Build project
        run: dotnet build JioTv.Playwright.csproj --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Install Playwright browser
        shell: pwsh
        run: |
          $script = "bin/$env:BUILD_CONFIGURATION/net8.0/playwright.ps1"
          if (-not (Test-Path $script)) {
            throw "Playwright install script was not generated at $script."
          }

          & $script install --with-deps $env:BROWSER
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run JioTV tests
        shell: bash
        run: |
          args=(
            --configuration "$BUILD_CONFIGURATION"
            --no-build
            --settings playwright.runsettings
            --logger "trx;LogFileName=jio-tv-tests.trx"
            --results-directory TestResults
          )

          if [[ -n "$TEST_FILTER" ]]; then
            args+=(--filter "$TEST_FILTER")
          fi

          dotnet test JioTv.Playwright.csproj "${args[@]}"

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-tv-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-tv-allure-results-${{ env.REPORT_ENVIRONMENT }}-${{ github.run_number }}
          path: bin/${{ env.BUILD_CONFIGURATION }}/net8.0/allure-results
          if-no-files-found: warn

  publish-allure:
    if: always() && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: allure-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: jio-tv-allure-results-${{ needs.test.outputs.report_environment }}-${{ github.run_number }}
          path: allure-results

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Archive HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ needs.test.outputs.report_environment }}-${{ github.run_number }}
          path: allure-report
          retention-days: 90

      - name: Build report archive site
        shell: bash
        env:
          REPORT_ENVIRONMENT: ${{ needs.test.outputs.report_environment }}
        run: |
          set -euo pipefail

          mkdir -p site
          if git fetch origin gh-pages:gh-pages; then
            git archive gh-pages | tar -x -C site
          fi

          report_path="site/reports/$REPORT_ENVIRONMENT/$GITHUB_RUN_NUMBER"
          latest_path="site/latest/$REPORT_ENVIRONMENT"
          mkdir -p "$report_path" "$latest_path"
          cp -R allure-report/. "$report_path/"
          rm -rf "$latest_path"
          mkdir -p "$latest_path"
          cp -R allure-report/. "$latest_path/"

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8"><title>JioTV Allure Reports</title></head><body>'
            echo '<h1>JioTV Allure Reports</h1><p>Latest reports by environment:</p><ul>'
            for environment_path in site/latest/*; do
              [ -d "$environment_path" ] || continue
              environment="${environment_path##*/}"
              printf '<li><a href="latest/%s/">%s latest</a></li>\n' "$environment" "$environment"
            done
            echo '</ul><h2>Archived runs</h2><ul>'
            for report_path in site/reports/*/*; do
              [ -d "$report_path" ] || continue
              environment="$(basename "$(dirname "$report_path")")"
              run_number="$(basename "$report_path")"
              printf '<li><a href="reports/%s/%s/">%s run %s</a></li>\n' "$environment" "$run_number" "$environment" "$run_number"
            done
            echo '</ul></body></html>'
          } > site/index.html

      - name: Publish report archive to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
