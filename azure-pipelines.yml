trigger: none

pr: none

parameters:
  - name: testFilter
    displayName: Test filter
    type: string
    default: ""

  - name: browser
    displayName: Browser
    type: string
    default: chromium
    values:
      - chromium
      - firefox
      - webkit

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: 8.x
  projectPath: JioTv.Playwright.csproj

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: $(dotnetVersion)

  - task: DotNetCoreCLI@2
    displayName: Restore project
    inputs:
      command: restore
      projects: $(projectPath)

  - task: DotNetCoreCLI@2
    displayName: Build project
    inputs:
      command: build
      projects: $(projectPath)
      arguments: --configuration $(buildConfiguration) --no-restore

  - pwsh: |
      $playwrightScript = "$(Build.SourcesDirectory)/bin/$(buildConfiguration)/net8.0/playwright.ps1"
      if (-not (Test-Path $playwrightScript)) {
        throw "Playwright install script was not generated at $playwrightScript."
      }

      & $playwrightScript install --with-deps $env:BROWSER
      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }
    displayName: Install Playwright browser
    env:
      BROWSER: ${{ parameters.browser }}

  - pwsh: |
      $testArguments = @(
        "--configuration", "$(buildConfiguration)",
        "--no-build",
        "--settings", "playwright.runsettings",
        "--logger", "trx;LogFileName=jio-tv-tests.trx",
        "--results-directory", "$(Agent.TempDirectory)/test-results"
      )

      if (-not [string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
        $testArguments += @("--filter", $env:TEST_FILTER)
      }

      & dotnet test "$(projectPath)" @testArguments
      exit $LASTEXITCODE
    displayName: Run JioTV tests
    env:
      TEST_FILTER: ${{ parameters.testFilter }}

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: "$(Agent.TempDirectory)/test-results/*.trx"
      searchFolder: $(Agent.TempDirectory)/test-results
      mergeTestResults: true
      failTaskOnFailedTests: false

  - pwsh: |
      New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)/allure-results" -Force | Out-Null
    displayName: Prepare Allure results
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: Publish Allure results
    condition: always()
    inputs:
      targetPath: $(Build.SourcesDirectory)/allure-results
      artifact: jio-tv-allure-results
      publishLocation: pipeline

  - task: PublishAllureReport@2
    displayName: Publish Allure report tab
    condition: always()
    inputs:
      allureVersion: 2.36.0
      testResultsDir: $(Build.SourcesDirectory)/allure-results